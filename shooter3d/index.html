<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Mobile 3D Shooter</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="ui-root">
      <div id="hud">
        <div id="label-level">Уровень: <span id="level">1</span></div>
        <div id="label-health">Здоровье: <span id="health">100</span></div>
        <div id="label-enemies">Противники: <span id="enemies">0</span></div>
      </div>
      <div id="controls">
        <div id="move-zone"><div id="stick"></div></div>
        <button id="fire-btn" aria-label="Стрелять">●</button>
        <button id="jump-btn" aria-label="Прыжок">↟</button>
      </div>
      <div id="start-overlay">
        <h1>3D Shooter</h1>
        <p>Нажми, чтобы начать</p>
        <button id="start-btn">Старт</button>
      </div>
      <div id="game-over" class="hidden">
        <h2>Игра окончена</h2>
        <p id="final-stats"></p>
        <button id="restart-btn">Заново</button>
      </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
